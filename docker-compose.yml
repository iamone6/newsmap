services:
  db:
    build:
      context: ./dockerfiles
      dockerfile: db.dockerfile
    image: newsmap-db:18.6
    restart: unless-stopped
    env_file:
      - ./apps/db/.env
    environment:
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 공식 이미지부터 마운트 지점이 /var/lib/postgresql 로 바뀌었다 (PGDATA=/var/lib/postgresql/18/docker).
      - /data/postgres:/var/lib/postgresql
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
