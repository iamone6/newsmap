services:
  db:
    build:
      context: ./dockerfiles
      dockerfile: db.dockerfile
    image: newsmap-db:18.6
    restart: unless-stopped
    env_file:
      - ./apps/db/.env
    environment:
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 공식 이미지부터 마운트 지점이 /var/lib/postgresql 로 바뀌었다 (PGDATA=/var/lib/postgresql/18/docker).
      - /data/postgres:/var/lib/postgresql
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  rag:
    build:
      context: ./apps/rag
      dockerfile: ../../dockerfiles/rag.dockerfile
    image: newsmap-rag:0.1.0
    restart: unless-stopped
    env_file:
      - ./apps/rag/.env
    environment:
      TZ: Asia/Seoul
      DB_HOST: db
    volumes:
      - ./apps/rag/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  fe:
    build:
      context: ./apps/fe
      dockerfile: ../../dockerfiles/fe.dockerfile
      secrets:
        - fe_env
    image: newsmap-fe:0.1.0
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    ports:
      # prod 는 80 으로 접근한다. 로컬은 docker-compose.override.yml 에서 4000 으로 바꾼다.
      - "80:3000"

secrets:
  # NEXT_PUBLIC_* 는 빌드 시점에 번들로 박히므로 apps/fe/.env 를 빌드 때만 넘긴다 (dockerfiles/fe.dockerfile 참고)
  fe_env:
    file: ./apps/fe/.env
