services:
  db:
    build:
      context: ./dockerfiles
      dockerfile: db.dockerfile
    image: newsmap-db:18.6
    restart: unless-stopped
    env_file:
      - ./apps/db/.env
    environment:
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 공식 이미지부터 마운트 지점이 /var/lib/postgresql 로 바뀌었다 (PGDATA=/var/lib/postgresql/18/docker).
      - /data/postgres:/var/lib/postgresql
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  rag:
    build:
      context: ./apps/rag
      dockerfile: ../../dockerfiles/rag.dockerfile
    image: newsmap-rag:0.1.0
    restart: unless-stopped
    env_file:
      - ./apps/rag/.env
    environment:
      TZ: Asia/Seoul
      DB_HOST: db
    volumes:
      - ./apps/rag/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  fe:
    build:
      context: ./apps/fe
      dockerfile: ../../dockerfiles/fe.dockerfile
      secrets:
        - fe_env
    image: newsmap-fe:0.1.0
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    # 호스트에 직접 열지 않는다. 화면 요청은 be(FrankenPHP/Caddy)가 받아 여기로 프록시한다 (apps/be/Caddyfile).
    expose:
      - "3000"

  be:
    build:
      context: ./apps/be
      dockerfile: ../../dockerfiles/be.dockerfile
      target: prod
    image: newsmap-be:0.1.0
    restart: unless-stopped
    env_file:
      - ./apps/be/.env
    environment:
      TZ: Asia/Seoul
      DB_HOST: db
    # 프로젝트 앞단. /api/* 는 Laravel, 나머지는 fe 로 넘긴다.
    # 호스트 포트는 열지 않는다. 같은 서버의 앞단 Caddy(vultr_proxy 저장소)가 80/443(로컬 4000)과 인증서를 맡고,
    # 공유 네트워크 edge 에서 newsmap-be:80 으로 이 컨테이너를 부른다. edge 는 `docker network create edge` 로 먼저 만든다.
    networks:
      default: {}
      edge:
        aliases:
          - newsmap-be
    volumes:
      # Caddy 데이터·설정 디렉터리. 인증서는 앞단 vultr_proxy 가 발급하므로 지금은 거의 비어 있다.
      # SERVER_NAME 에 도메인을 넣어 단독으로 80/443 을 열 때 인증서를 유지하려고 남겨 둔다
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      db:
        condition: service_healthy
      fe:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true

secrets:
  # NEXT_PUBLIC_* 는 빌드 시점에 번들로 박히므로 apps/fe/.env 를 빌드 때만 넘긴다 (dockerfiles/fe.dockerfile 참고)
  fe_env:
    file: ./apps/fe/.env
