# 배포: master push(또는 수동 실행) → CI 통과 → 이미지 4개 빌드·GHCR push → Vultr 서버에서 교체.
# 서버 준비·필요한 Secrets/Variables 는 README "운영 배포" 참고.
#   Secrets:   VULTR_HOST, VULTR_USER, VULTR_SSH_KEY, VULTR_SSH_FINGERPRINT, FE_KAKAO_MAP_JS_KEY
#   Variables: PROD_DOMAIN (예: newsmap.example.com)
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# 배포가 겹치지 않게 하나씩 돌린다. 진행 중인 배포는 끊지 않는다
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: db
            context: dockerfiles
            file: dockerfiles/db.dockerfile
          - name: rag
            context: apps/rag
            file: dockerfiles/rag.dockerfile
          - name: fe
            context: apps/fe
            file: dockerfiles/fe.dockerfile
          - name: be
            context: apps/be
            file: dockerfiles/be.dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그: sha-<커밋 7자리>(롤백용) + latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/newsmap-${{ matrix.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      # fe 의 NEXT_PUBLIC_* 는 빌드 때 번들에 박힌다. dockerfiles/fe.dockerfile 이 fe_env secret 을 .env 로 마운트한다
      # build secret 내용은 Docker 레이어 캐시 키에 들어가지 않는다. 키만 바꾸면 빈 키로 만든 캐시를 그대로 쓰므로
      # fe.env 해시를 build-arg(FE_ENV_HASH)로 넘겨 값이 바뀌면 npm run build 를 다시 돌린다.
      - name: fe 빌드용 .env 생성
        id: fe_env
        if: matrix.name == 'fe'
        env:
          KAKAO_KEY: ${{ secrets.FE_KAKAO_MAP_JS_KEY }}
        run: |
          if [ -z "$KAKAO_KEY" ]; then
            echo "::warning::FE_KAKAO_MAP_JS_KEY 가 비어 있다. fe 는 카카오맵 대신 SVG 지도로 빌드된다."
          fi
          {
            echo "NEXT_PUBLIC_KAKAO_MAP_JS_KEY=${KAKAO_KEY}"
            echo "NEXT_PUBLIC_API_BASE_URL=/api/v1"
            echo "NEXT_PUBLIC_USE_MOCK_API=false"
          } > "$RUNNER_TEMP/fe.env"
          echo "hash=$(sha256sum "$RUNNER_TEMP/fe.env" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # 바뀌지 않은 이미지는 GHA 캐시로 금방 끝나고 태그만 새로 붙는다
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: ${{ matrix.name == 'fe' && format('fe_env={0}/fe.env', runner.temp) || '' }}
          build-args: ${{ matrix.name == 'fe' && format('FE_ENV_HASH={0}', steps.fe_env.outputs.hash) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://${{ vars.PROD_DOMAIN }}
    steps:
      - uses: actions/checkout@v5

      # 서버에는 소스를 두지 않는다. compose 파일과 운영 스크립트만 올린다 (apps/*/.env 는 서버에만 있다)
      - name: compose·운영 스크립트 복사
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          fingerprint: ${{ secrets.VULTR_SSH_FINGERPRINT }}
          source: docker-compose.yml,docker-compose.prod.yml,deploy/
          target: /srv/newsmap

      - name: 서버에서 새 이미지로 교체
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          fingerprint: ${{ secrets.VULTR_SSH_FINGERPRINT }}
          command_timeout: 15m
          script: |
            chmod +x /srv/newsmap/deploy/*.sh
            /srv/newsmap/deploy/deploy.sh "sha-${GITHUB_SHA::7}"
          envs: GITHUB_SHA

      - name: 외부에서 /up 확인
        run: |
          for _ in $(seq 1 12); do
            curl -fsS "https://${{ vars.PROD_DOMAIN }}/up" > /dev/null && exit 0
            sleep 5
          done
          echo "https://${{ vars.PROD_DOMAIN }}/up 응답 없음" >&2
          exit 1
