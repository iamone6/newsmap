# 운영(Vultr) 서버 전용 설정. docker-compose.yml 위에 겹쳐 쓴다.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 이미지는 GitHub Actions 가 빌드해 GHCR 에 올린 것을 받기만 하고, 서버에서는 빌드하지 않는다 (.github/workflows/deploy.yml).
# IMAGE_TAG 를 이전 태그(sha-xxxxxxx)로 주면 그 버전으로 되돌린다. 비우면 latest.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    build: !reset null
    image: ghcr.io/iamone6/newsmap-db:${IMAGE_TAG:-latest}
    logging: *default-logging

  rag:
    build: !reset null
    image: ghcr.io/iamone6/newsmap-rag:${IMAGE_TAG:-latest}
    logging: *default-logging
    volumes:
      # Qwen3 토크나이저를 컨테이너를 다시 만들 때마다 내려받지 않도록 Hugging Face 캐시를 유지한다
      - hf_cache:/root/.cache/huggingface

  fe:
    build: !reset null
    image: ghcr.io/iamone6/newsmap-fe:${IMAGE_TAG:-latest}
    logging: *default-logging
    volumes:
      # next/image 가 줄인 썸네일 디스크 캐시. 컨테이너를 다시 만들어도 유지한다
      - fe_cache:/app/.next/cache

  be:
    build: !reset null
    image: ghcr.io/iamone6/newsmap-be:${IMAGE_TAG:-latest}
    logging: *default-logging

volumes:
  hf_cache:
  fe_cache:
