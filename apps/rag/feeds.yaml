# RSS 피드 설정. 피드·언론사 목록은 DB가 아니라 이 파일로 관리한다 (CLAUDE.md 참고).
# DB에는 feed_key, publisher_name 만 저장한다.
#
# type: direct              피드 하나 = 언론사 하나 고정. publisher_name 사용.
# type: google_news_search  검색 기반 피드. 언론사가 기사마다 다르므로 publisher_name 없이,
#                            수집기가 각 item 의 <source> 태그에서 읽는다.
#                            <link> 는 구글 내부 리다이렉트 ID라 별도 디코딩이 필요하다.
#                            exclude_sources 에 걸리는 도메인의 기사는 수집하지 않는다.
#
# 조사 근거: prompts/regional-rss-feeds.research.md (조사일 2026-10-02, 서울·부산은 이후 보강)

exclude_sources: # google_news_search 전용. <source url="..."> 의 호스트 기준 매칭
  # 전국 종합일간지
