# LLM 이 돌려준 시도명을 현행 행정구역 시도명으로 바꾸는 별칭 표.
# 행정구역 개편(통합·명칭 변경)으로 기사 본문에 옛 이름이 남아 있을 때 쓴다.
# 키: 옛 이름/줄임말, 값: regions.sido_name 에 있는 현행 이름 (정확히 일치해야 한다)
#
# 시군구가 1:N 으로 쪼개진 경우(예: 인천 중구 → 제물포구/영종구)는 별칭으로 표현할 수 없어서,
# regions.py 가 "시도 + 읍면동명" 이 유일하면 그 읍면동으로 매칭하는 대체 경로로 처리한다.
sido:
  광주광역시: 전남광주통합특별시
  광주: 전남광주통합특별시
  전라남도: 전남광주통합특별시
  전남: 전남광주통합특별시
  전남광주: 전남광주통합특별시
  전남광주특별시: 전남광주통합특별시
  # 명칭 변경 (2023-06-11 강원특별자치도, 2024-01-18 전북특별자치도)
  강원도: 강원특별자치도
  강원: 강원특별자치도
  전라북도: 전북특별자치도
  전북: 전북특별자치도
  # 줄임말
  서울: 서울특별시
  부산: 부산광역시
  대구: 대구광역시
  인천: 인천광역시
  대전: 대전광역시
  대전시: 대전광역시
  울산: 울산광역시
  세종: 세종특별자치시
  제주: 제주특별자치도
  제주도: 제주특별자치도
