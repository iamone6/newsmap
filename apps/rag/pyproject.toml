[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4,<5",
    "feedparser>=6,<7",
    "googlenewsdecoder>=0.2,<1",
    "langchain>=1.4,<2",
    "langchain-openai>=1.7,<2",
    "langchain-text-splitters>=1.1,<2",
    "lxml>=6,<7",
    "pgvector>=0.5,<1",
    "psycopg[binary]>=3,<4",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "requests>=2.34,<3",
    "trafilatura>=2.3,<3",
    "transformers>=5,<6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# 배포용 라이브러리가 아니라 cron 으로 실행하는 애플리케이션이라 패키지로 빌드하지 않는다.
package = false
